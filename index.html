<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Champ libre — blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* VOICE: serious agricultural-economics column — calm, editorial, credible
   IDEA: a land survey register; each article filed like a parcel on a cadastral map
   PICTURE: real photos where provided; otherwise deep-green covers with contour lines, like a survey map
   COLOUR and TYPE: forest green dominant, moss support, wheat-gold hairline accent; Newsreader + Inter
   LAYOUT: newspaper masthead, featured story, month-by-month archive rows, 700px reading column */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0d1410);--soft:light-dark(#f2f5f0,#141e17);--ink:light-dark(#141a16,#e7ede6);
--mute:light-dark(#56635a,#9fada2);--green:light-dark(#1e4a32,#9cc9a8);--deep:#173a27;
--moss:light-dark(#5c7d45,#8fb276);--gold:#c49a2c;--line:light-dark(#dfe5dc,#25332a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 Inter,system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:700;line-height:1.08;text-wrap:balance;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(5vw,16px)}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
/* masthead */
.mast{border-bottom:1px solid var(--line)}
.mastTop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;font-size:14px;color:var(--mute);border-bottom:1px solid var(--line)}
.lang{display:inline-flex;gap:2px}
.lang button{all:unset;cursor:pointer;min-height:40px;min-width:40px;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;border-bottom:2px solid transparent;color:var(--mute)}
.lang button[aria-pressed=true]{color:var(--ink);border-color:var(--gold)}
.brand{text-align:center;padding:clamp(22px,4vw,40px) 0 14px}
.brand a{text-decoration:none}
.brand h1{font-size:clamp(40px,7vw,68px);letter-spacing:-.01em;color:var(--green)}
.brand p{margin:6px 0 0;color:var(--mute);font-family:Newsreader,serif;font-size:19px;font-style:italic}
nav.main{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 28px;border-top:1px solid var(--line);padding:2px 0}
nav.main a{text-decoration:none;font-weight:500;font-size:15px;min-height:44px;display:inline-flex;align-items:center;border-bottom:2px solid transparent}
nav.main a.on{border-color:var(--green)}
/* covers */
.cover{position:relative;background:var(--deep);overflow:hidden;aspect-ratio:16/10}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover svg{position:absolute;inset:0;width:100%;height:100%}
/* featured */
.feat{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:center;padding:clamp(26px,4vw,48px) 0;border-bottom:1px solid var(--line);text-decoration:none}
.feat h2{font-size:clamp(30px,4vw,44px);margin:10px 0 12px}
.feat p{margin:0;color:var(--mute);font-size:18px}
.kicker{font-size:14px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 10px}
.kicker b{color:var(--green);font-weight:600}
.more{display:inline-block;margin-top:16px;font-weight:600;color:var(--green)}
/* archive */
.filters{display:flex;flex-wrap:wrap;gap:4px 20px;padding:20px 0 4px}
.filters button{all:unset;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;font-size:15px;color:var(--mute);border-bottom:2px solid transparent}
.filters button[aria-pressed=true]{color:var(--ink);border-color:var(--green);font-weight:600}
.month{font-size:26px;color:var(--green);padding:30px 0 10px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.month small{font:500 14px Inter,sans-serif;color:var(--mute)}
.row{display:grid;grid-template-columns:90px minmax(0,1fr) 200px;gap:20px;padding:20px 0;border-bottom:1px solid var(--line);text-decoration:none;align-items:start}
.row time{font-size:14px;color:var(--mute);padding-top:4px}
.row h3{font-size:23px;margin:4px 0 6px}
.row p{margin:0;color:var(--mute);font-size:16px}
.row:hover h3{color:var(--green)}
.row .cover{aspect-ratio:16/10}
/* post */
article.post{max-width:700px;margin:0 auto;padding:clamp(24px,4vw,48px) 0}
.post h1{font-size:clamp(32px,4.8vw,48px);margin:12px 0 14px}
.deck{font-family:Newsreader,serif;font-size:22px;line-height:1.4;color:var(--mute);margin:0 0 24px}
.post .cover{margin:0 0 28px;aspect-ratio:16/9}
.take{border-left:3px solid var(--green);padding:4px 0 4px 22px;margin:30px 0}
.take h2{font-size:24px;color:var(--green);margin-bottom:6px}
.take p:last-child{margin-bottom:0}
.src{background:var(--soft);border-radius:6px;padding:16px 18px;margin:30px 0 0;font-size:15px}
.src small{display:block;color:var(--mute);margin-bottom:2px}
.src a{font-weight:600;color:var(--green);overflow-wrap:anywhere}
.back{display:inline-flex;min-height:44px;align-items:center;text-decoration:none;font-size:15px;color:var(--mute)}
.pn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:36px;border-top:1px solid var(--line);padding-top:18px}
.pn a{text-decoration:none;font-family:Newsreader,serif;font-size:19px;font-weight:600;line-height:1.25}
.pn small{display:block;font:500 13px Inter,sans-serif;color:var(--mute);margin-bottom:4px}
/* about */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:clamp(24px,5vw,64px);padding:clamp(26px,4vw,52px) 0;align-items:start}
.about .cover{aspect-ratio:4/5;position:sticky;top:20px}
.about h1{font-size:clamp(34px,5vw,50px);margin-bottom:16px}
.about h2{font-size:25px;color:var(--green);margin:30px 0 6px}
.path{display:flex;flex-wrap:wrap;gap:6px 0;margin:0 0 8px;font-size:15px;color:var(--mute)}
.path span+span::before{content:"→";margin:0 10px;color:var(--gold)}
footer{border-top:1px solid var(--line);margin-top:40px;font-size:14px;color:var(--mute)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;padding-top:22px;padding-bottom:28px}
.note{flex-basis:100%;font-size:12.5px;opacity:.8}
@media(max-width:820px){.feat,.about{grid-template-columns:minmax(0,1fr)}.about .cover{position:relative;top:0;aspect-ratio:16/10}.row{grid-template-columns:minmax(0,1fr) 140px}.row time{grid-column:1/-1;padding:0}}
@media(max-width:560px){.row{grid-template-columns:minmax(0,1fr)}.row .cover{display:none}.pn{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header class="mast"><div class="wrap">
  <div class="mastTop"><span id="mDate"></span><div class="lang" role="group" aria-label="Langue / Language"><button id="bFr">FR</button><button id="bEn">EN</button></div></div>
  <div class="brand"><a href="#home"><h1>Champ libre</h1></a><p id="tag"></p></div>
  <nav class="main" aria-label="Menu"><a href="#home" id="nHome"></a><a href="#about" id="nAbout"></a></nav>
</div></header>
<main id="app" class="wrap"></main>
<footer><div class="wrap"><span>© 2023 Champ libre · Vladimir P.</span><span id="fTag"></span><p class="note" id="fNote"></p></div></footer>
<script src="posts.js"></script>
<script src="scenes.js"></script>
<script>
{
const $=s=>document.querySelector(s),app=$('#app');
let lang='fr';try{lang=localStorage.getItem('cl-lang')||'fr'}catch(e){}
let cat='all';
const UI={
 fr:{art:'Articles',about:'À propos',tag:'Agriculture, business et économie — lus et commentés',all:'Tous',n:n=>n+(n>1?' articles':' article'),take:'Mon avis',src:'Article original',prev:'Article précédent',next:'Article suivant',min:'min de lecture',back:'← Tous les articles',read:'Lire l’article →',latest:'Dernier article',arch:'Archives',note:'Projet réalisé dans le cadre d’un exercice — les dates de publication sont fictives.',foot:'Un blog sur l’agriculture et l’agrobusiness en France et en Europe'},
 en:{art:'Posts',about:'About',tag:'Farming, business and economics — read and discussed',all:'All',n:n=>n+(n>1?' posts':' post'),take:'My take',src:'Original article',prev:'Previous post',next:'Next post',min:'min read',back:'← All posts',read:'Read the post →',latest:'Latest post',arch:'Archive',note:'Project made as part of an assignment — publication dates are fictional.',foot:'A blog about farming and agribusiness in France and Europe'}};
const CATS={story:['Mon histoire','My story'],markets:['Marchés','Markets'],water:['Eau','Water'],climate:['Climat','Climate'],wine:['Vigne et vin','Wine'],trade:['Commerce','Trade'],policy:['Politique agricole','Farm policy'],pesticides:['Phytosanitaires','Crop protection'],livestock:['Élevage','Livestock']};
const SRC=window.SRC||{},IMG=window.IMG||{};
const P=window.POSTS.slice().sort((a,b)=>a.d<b.d?1:-1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const loc=()=>lang==='fr'?'fr-FR':'en-GB';
const fmt=(d,o)=>new Date(d+'T12:00:00').toLocaleDateString(loc(),o||{day:'numeric',month:'long',year:'numeric'});
const cname=c=>CATS[c][lang==='fr'?0:1];
const mins=p=>Math.max(2,Math.round([...p[lang].b,...p[lang].o].join(' ').split(/\s+/).length/200));

/* contour-line cover, deterministic per key */
function topo(key){
 let h=0;for(const ch of key)h=(h*31+ch.charCodeAt(0))>>>0;
 const r=()=>(h=(h*1103515245+12345)>>>0,h/4294967296);
 const cx=200+r()*400,cy=110+r()*140,ph=[r()*6,r()*6,r()*6];
 let d='';
 for(let k=1;k<=16;k++){
  const R=k*34;let s='';
  for(let i=0;i<=48;i++){const a=i/48*Math.PI*2;
   const w=1+.16*Math.sin(3*a+ph[0]+k*.2)+.1*Math.sin(5*a+ph[1])+.06*Math.sin(7*a+ph[2]-k*.3);
   s+=(i?'L':'M')+(cx+Math.cos(a)*R*w*1.35).toFixed(1)+' '+(cy+Math.sin(a)*R*w).toFixed(1)}
  d+=`<path d="${s}Z" stroke="${k%4===0?'#c49a2c':'#9cc9a8'}" stroke-opacity="${k%4===0?.55:.28}" stroke-width="${k%4===0?1.4:1}" fill="none"/>`}
 return `<svg viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${d}</svg>`}
const cover=(key,label)=>{const sc=window.SCENE&&window.SCENE(key);return `<div class="cover">${IMG[key]?`<img src="${esc(IMG[key])}" alt="" loading="lazy">`:sc||topo(key)}</div>`};

function home(){const u=UI[lang],f=P[0];
 const used=[...new Set(P.map(p=>p.c))];
 const list=P.filter(p=>cat==='all'||p.c===cat);
 const months=[...new Set(list.map(p=>p.d.slice(0,7)))];
 app.innerHTML=`<a class="feat" href="#p-${f.id}">${cover(f.id,cname(f.c))}<div><div class="kicker"><b>${u.latest}</b><span>${fmt(f.d)}</span></div><h2>${esc(f[lang].t)}</h2><p>${esc(f[lang].s)}</p><span class="more">${u.read}</span></div></a>
 <div class="filters" role="group">${['all',...used].map(k=>`<button data-c="${k}" aria-pressed="${cat===k}">${k==='all'?u.all:cname(k)}</button>`).join('')}</div>
 ${months.map(m=>{const ps=list.filter(p=>p.d.startsWith(m));const t=fmt(m+'-01',{month:'long',year:'numeric'});
  return `<h2 class="month">${t[0].toUpperCase()+t.slice(1)}<small>${u.n(ps.length)}</small></h2>${ps.map(p=>`<a class="row" href="#p-${p.id}"><time datetime="${p.d}">${fmt(p.d,{day:'numeric',month:'short'})}</time><div><div class="kicker"><b>${cname(p.c)}</b><span>${mins(p)} ${u.min}</span></div><h3>${esc(p[lang].t)}</h3><p>${esc(p[lang].s)}</p></div>${cover(p.id)}</a>`).join('')}`}).join('')}`;
 app.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;home()});
}

function post(id){const i=P.findIndex(p=>p.id===id);if(i<0)return home();
 const p=P[i],t=p[lang],u=UI[lang],nx=P[i-1],pv=P[i+1],s=SRC[p.id];
 app.innerHTML=`<article class="post"><a class="back" href="#home">${u.back}</a>
 <div class="kicker"><b>${cname(p.c)}</b><span>${fmt(p.d)}</span><span>· ${mins(p)} ${u.min}</span></div>
 <h1>${esc(t.t)}</h1><p class="deck">${esc(t.s)}</p>${cover(p.id)}
 ${t.b.map(x=>`<p>${esc(x)}</p>`).join('')}
 <div class="take"><h2>${t.oh?esc(t.oh):u.take}</h2>${t.o.map(x=>`<p>${esc(x)}</p>`).join('')}</div>
 ${s?`<div class="src"><small>${u.src}</small><a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])} ↗</a></div>`:''}
 <nav class="pn">${pv?`<a href="#p-${pv.id}"><small>← ${u.prev}</small>${esc(pv[lang].t)}</a>`:'<span></span>'}${nx?`<a href="#p-${nx.id}" style="text-align:right"><small>${u.next} →</small>${esc(nx[lang].t)}</a>`:''}</nav></article>`;
}

function about(){const a=window.ABOUT[lang];
 app.innerHTML=`<section class="about">${cover('about',lang==='fr'?'Souzdal':'Suzdal')}<div><h1>${esc(a.t)}</h1><div class="path"><span>${lang==='fr'?'Moscou':'Moscow'}</span><span>${lang==='fr'?'Souzdal':'Suzdal'}</span><span>Paris</span></div>${a.sec.map(s=>`${s.h?`<h2>${esc(s.h)}</h2>`:''}${s.p.map(x=>`<p>${esc(x)}</p>`).join('')}`).join('')}</div></section>`;
}

function route(){const h=location.hash.slice(1)||'home',u=UI[lang];
 document.documentElement.lang=lang;
 $('#bFr').setAttribute('aria-pressed',lang==='fr');$('#bEn').setAttribute('aria-pressed',lang==='en');
 $('#nHome').textContent=u.art;$('#nAbout').textContent=u.about;$('#tag').textContent=u.tag;$('#fTag').textContent=u.foot;$('#fNote').textContent=u.note;
 $('#mDate').textContent=lang==='fr'?'Paris · un blog de Vladimir P.':'Paris · a blog by Vladimir P.';
 $('#nHome').classList.toggle('on',h!=='about');$('#nAbout').classList.toggle('on',h==='about');
 if(h==='about')about();else if(h.startsWith('p-'))post(h.slice(2));else home();
 window.scrollTo(0,0);
}
const setLang=l=>{lang=l;try{localStorage.setItem('cl-lang',l)}catch(e){}route()};
$('#bFr').onclick=()=>setLang('fr');$('#bEn').onclick=()=>setLang('en');
addEventListener('hashchange',route);route();
}
</script>
</body>
</html>
